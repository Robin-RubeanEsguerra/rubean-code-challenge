<div class="container">
  <form (ngSubmit)="insertData(editingId())" class="p-3 w-50 d-flex gap-1 gap-md-3 flex-column max-w-md mx-auto card" [formGroup]="customerForm">
    <h6 class="fw-bold fs-6">
      View Customer - {{ customer()?.first_name }} {{ customer()?.last_name }}
    </h6>
    <div class="form-group">
      <label for="first_name">First Name</label>
      <input type="text" name="first_name" class="form-control" formControlName="firstName" />
    </div>
    <div class="form-group">
      <label for="last_name">Last Name</label>
      <input type="text" name="last_name" class="form-control" formControlName="lastName" />
    </div>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" name="email" class="form-control" formControlName="email" />
    </div>
    <div class="form-group">
      <label for="contact">Contact Number</label>
      <input type="text" name="contact" class="form-control" formControlName="contact" inputmode="tel" (input)="allowContactChars($event)" />
    </div>
    <div class="d-flex gap-2 ">
      <button type="submit" class="btn btn-sm btn-success w-100">
        @if (isSubmitting()) {
          <div class="d-flex justify-content-center align-items-center">
            <app-spinner></app-spinner>
          </div>
        } @else {
            Update Customer
        }
      </button>
    </div>
  </form>
  </div>
